services:
  api:
    build:
      context: ./apps/api
    environment:
      BLUEVERSE_ENV: ${BLUEVERSE_ENV:-development}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-http://host.docker.internal:3000}
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    ports:
      - "${PORTAL_API_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    ports:
      - "${PORTAL_WEB_PORT:-4173}:80"
    restart: unless-stopped
